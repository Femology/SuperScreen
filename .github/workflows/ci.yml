name: Python prototype CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Syntax check
        run: python -m compileall -q host/superscreen

  android:
    name: Android alpha APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Android APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SuperScreen-Android-Alpha
          path: android/app/build/outputs/apk/debug/*.apk

  windows-package:
    name: Windows portable executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host and packaging tools
        run: python -m pip install -e . pyinstaller
      - name: Build portable Windows host
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --name SuperScreen --paths host --add-data "host/superscreen/web/index.html;superscreen/web" host/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: SuperScreen-Windows-Portable
          path: dist/SuperScreen.exe
