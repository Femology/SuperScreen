name: Publish SuperScreen preview binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pyinstaller
      - name: Package unsigned Windows portable executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --name SuperScreen --paths host --add-data "host/superscreen/web/index.html;superscreen/web" host/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows
          path: dist/SuperScreen.exe

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build Android preview APK (debug-signed)
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: preview-android
          path: android/app/build/outputs/apk/debug/*.apk

  publish:
    needs: [test, windows, android]
    if: github.repository == 'Femology/SuperScreen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-windows
          path: packages/windows
      - uses: actions/download-artifact@v4
        with:
          name: preview-android
          path: packages/android
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          cp packages/windows/SuperScreen.exe dist/SuperScreen-Windows.exe
          cp packages/android/app-debug.apk dist/SuperScreen-Android.apk
          cd dist
          sha256sum SuperScreen-Windows.exe SuperScreen-Android.apk > SHA256SUMS.txt
      - name: Publish preview (not production)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview.1
          target_commitish: ${{ github.sha }}
          name: SuperScreen 0.1.0 Preview — Windows + Android
          prerelease: true
          draft: false
          make_latest: false
          files: |
            dist/SuperScreen-Windows.exe
            dist/SuperScreen-Android.apk
            dist/SHA256SUMS.txt
          body: |
            # SuperScreen experimental preview

            Two packages are available: an unsigned Windows desktop-mirroring host and a debug-signed Android launcher. The same Android phone can provide the Wi-Fi hotspot and receive the Windows screen. No external router or mobile data is required for local streaming.

            **Important:** This is NOT yet production secure. Screen frames and bearer tokens travel over unencrypted HTTP/WebSocket. Use only on your personally controlled, password-protected hotspot. Do not open the port to the public internet or use it to view secrets.

            The viewer mirrors one existing Windows display. This release does not create an extended virtual monitor, stream the Windows login screen, or remotely inject keyboard/touch input. Broken-screen operation without an external display has not been demonstrated on actual hardware.

            The APK is debug-signed; the Windows EXE is unsigned and may trigger SmartScreen warnings. Download only from this official repository and confirm checksums.

            Setup: https://github.com/Femology/SuperScreen/blob/main/docs/SETUP-WINDOWS.md
            Code and test plan: https://github.com/Femology/SuperScreen
